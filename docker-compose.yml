version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: loanlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - loanlens-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: loanlens-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_API_PORT=8000
      - ML_API_HOST=0.0.0.0
    networks:
      - loanlens-network
    volumes:
      - ./ml-service/models:/app/models

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: loanlens-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/loanlens
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=loanlens_prod_secure_secret_key_994821
      - MAX_FILE_SIZE_MB=15
    depends_on:
      - mongodb
      - ml-service
    networks:
      - loanlens-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: loanlens-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - loanlens-network

networks:
  loanlens-network:
    driver: bridge

volumes:
  mongo-data:
