name: LoanLens CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ml-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt

      - name: Validate Datasets & Schema
        run: |
          python ml-service/data/validate.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest ml-service/tests/test_adversarial_loan_scenarios.py ml-service/tests/test_ml_pipeline.py -v

      - name: Verify Automated MLOps Quality Gate
        run: |
          python -c "import sys; sys.path.insert(0, 'ml-service'); from quality.quality_gate import evaluate_quality_gate; rep = evaluate_quality_gate('Logistic Regression'); assert rep['quality_gate_status'] == 'PASSED', f'Gate failed: {rep}'; print('[OK] CI Quality Gate Verified')"


  node-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run backend tests
        run: |
          cd server
          npm test

  react-client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build React Vite bundle
        run: |
          cd client
          npm run build
